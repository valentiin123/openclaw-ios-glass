name: Build unsigned IPA

# Manuel uniquement : les minutes macOS comptent x10 en dépôt privé.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        default: Release
        type: choice
        options: [Release, Debug]

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS deps (protocol + mermaid generators)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@openclaw/gateway-protocol..." --filter "@openclaw/mermaid-renderer..."

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build (no signing)
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenClaw.xcodeproj \
            -scheme OpenClaw \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package unsigned IPA
        working-directory: apps/ios
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry OpenClawGlass-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OpenClawGlass-unsigned-ipa
          path: apps/ios/OpenClawGlass-unsigned.ipa
          retention-days: 14
